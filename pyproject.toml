[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "navier-stokes-lab"
version = "2.0.0"
description = "Educational Navier-Stokes lab in Python: exact solutions, cavity flow, Taylor-Green, 40+ diagrams"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.23", "scipy>=1.9", "pandas>=1.5", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=7", "jupyterlab>=4", "nbformat>=5"]

[tool.setuptools]
py-modules = ["navier_stokes", "viz", "cavity_cfd", "plot_vorticity"]

[tool.pytest.ini_options]
pythonpath = ["."]
